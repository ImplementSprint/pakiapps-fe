sonar.organization=your-org
sonar.projectKey=your-project-key

# Path to the source directories
sonar.sources=System-1-Web,System-2-Web,System-3-Web

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# TypeScript support
sonar.javascript.lcov.reportPaths=System-1-Web/coverage/lcov.info,System-2-Web/coverage/lcov.info,System-3-Web/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**, **/.next/**, **/dist/**, **/coverage/**
